<style>

.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:13px 24px;font-weight:700;margin-top:14px}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink);margin-left:8px}.btn:disabled{opacity:.6}
.tiles{display:flex;gap:14px;overflow:auto;padding-bottom:6px}.tile{flex:0 0 150px;position:relative;background:var(--soft);border-radius:14px;padding:10px 10px 0;text-align:center}.tile svg{width:100%;display:block}.tile b{display:block;padding:8px 0}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.card{display:block}.card .art{background:var(--soft);border-radius:14px;padding:16px 26px;transition:transform .2s}.card:hover .art{transform:translateY(-3px)}.card svg{width:100%;display:block}.card h3{margin:10px 0 0;font-size:15px}.m{color:var(--mute);font-size:13px}.pr{font-weight:700}
.styles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.st{background:var(--soft);border-radius:14px;padding:18px;text-align:center}.st svg{width:90px}.st b{display:block;font-size:18px}

.ci{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ci button{border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:28px}
@media(max-width:760px){.hero,.pp,.co{grid-template-columns:1fr}.big{padding:24px 28%}form{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.car{max-width:1200px;margin:24px auto 0;padding:0 4vw}
.vw{position:relative}
.trk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;border-radius:16px;scrollbar-width:none}

.cp,.cn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:24px;line-height:1}
.cp{left:12px}.cn{right:12px}

.dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
.dots button{width:9px;height:9px;border-radius:9px;border:0;background:var(--line);padding:0;transition:width .2s}
.dots button.on{background:var(--ink);width:22px}
@media(max-width:760px){.sl img{aspect-ratio:4/3}.cp,.cn{display:none}}
.hero>div{min-width:0}
.hero .car{margin:0;padding:0;max-width:none}
.hero .sl img{aspect-ratio:1/1}

.mml svg{width:26px;flex:none}
.bsec{background:linear-gradient(160deg,#d9cff7,#c3b3ee);border-radius:22px;padding:16px}
.bl{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.bb{background:#fff;border:2px solid transparent;border-radius:14px;height:76px;padding:12px 16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bb img{width:100%;height:100%;object-fit:contain;display:block}
.bb .tx{font-weight:800;font-size:16px}
.bb:hover,.bb[aria-expanded=true]{border-color:var(--ink)}
.bpn{display:none;margin-top:14px;background:#fff;border-radius:16px;padding:18px}
.bpn.open{display:block}
.bpn h3{margin:0 0 12px}
.bpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.bpg a{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:10px;padding:8px 10px}
.bpg a:hover{outline:2px solid var(--ink)}
.bpg svg{width:26px;flex:none}
@media(max-width:900px){.bl{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.bl{grid-template-columns:repeat(2,1fr)}}
.mk{position:relative;display:block}
.mk img{display:block;width:100%;height:auto;position:relative;mix-blend-mode:multiply}
.mk .ar{position:absolute;inset:0;background:var(--a) center/cover no-repeat;-webkit-mask:var(--c) center/100% 100% no-repeat;mask:var(--c) center/100% 100% no-repeat}
.mk.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 40%,rgba(255,255,255,.15));-webkit-mask:var(--c) center/100% 100% no-repeat;mask:var(--c) center/100% 100% no-repeat;pointer-events:none}
</style>
</head>
